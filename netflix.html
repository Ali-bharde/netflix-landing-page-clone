<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETFLIX</title>

    <style>
         .text {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
            color: black;
            gap: 3px;
            flex-direction: column;
        }
        .text h2{
            font-size: 50px;
            font-weight: 600;
        }
        .hero {
            position: relative;
            min-height: 150vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        nav{
            position: fixed;
            top: 0;
            left: 0;
            right: 130;
            z-index: 10;
            display: flex;
            justify-content: flex-end;
            padding: 20px 40px;
            /* background: linear-gradient(to bottom, rgb(0,0,0.8),transparent); */
        }

        .bg-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
            z-index: 0;
            /* background-color: black; */
        }
        nav h1{
            position: relative;
            z-index: 2;
            color: red;
            font-size: 60px;
        }
        .email-box{
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .email-box input {
            padding: 15px 20px;
            font-size: 18px;
            width: 350px;
            border: 1px white;
            border-radius: 5px;
            color: white;
        }

        .email-box button{
            padding: 15px 25px;
            background: #e50914;
            color: white;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav>
        <h1><b>NETFLIX</b></h1>  
    </nav>
    <div class="hero">
        <img src="wp1945909.jpg" class="bg-img">
        <div class="text"> 
            <h2>Unlimited movies, <br>shows, and more</h2>
            <h3> Starts at $150. Cancle at any time</h3>
            <div class="email-box">
                <input type="email" placeholder="Email address">
                <button>Get started</button>
            </div>
        </div>
        
    </div>

    
    
</body>
</html>
